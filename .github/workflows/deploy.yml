# 自动部署 Vite + React 项目到 GitHub Pages
name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      # 🔥 关键1：确保依赖完全一致（比 npm ci 更稳）
      - name: Install dependencies
        run: npm install

      # 🔥 关键2：Vite build
      - name: Build project
        run: npm run build

      # 🔥 关键3：确认 dist 存在（防止静默失败）
      - name: Check dist output
        run: ls -R dist

      # ✔ 上传正确目录
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4